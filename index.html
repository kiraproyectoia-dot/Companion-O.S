
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ly-Os | Enlace Neuronal</title>

    <meta name="description" content="Ly-Os: Cabeza parlante con IA en tiempo real.">
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Meta Tags para Play Store / Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Ly-Os">
    
    <!-- Apple Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="./assets/lily-icon.svg" type="image/svg+xml">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.23.0",
    "@react-three/drei": "https://aistudiocdn.com/@react-three/drei@^10.7.6",
    "@react-three/fiber": "https://aistudiocdn.com/@react-three/fiber@^9.3.0",
    "three": "https://aistudiocdn.com/three@^0.180.0"
  }
}
</script>
<style>
  :root {
    --sat: env(safe-area-inset-top);
    --sar: env(safe-area-inset-right);
    --sab: env(safe-area-inset-bottom);
    --sal: env(safe-area-inset-left);
  }
  * {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
  body {
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    background-color: black;
    color: white;
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: fixed;
  }
  #root {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
  }
  /* Estilo para simular splash screen en la carga */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease-out;
  }
  .loading-logo {
    font-family: sans-serif;
    font-weight: 900;
    letter-spacing: 0.5em;
    color: white;
    text-transform: uppercase;
    font-size: 1.5rem;
    animation: pulse-glow 2s infinite alternate;
  }
  @keyframes pulse-glow {
    from { opacity: 0.3; text-shadow: 0 0 10px rgba(168, 85, 247, 0); }
    to { opacity: 1; text-shadow: 0 0 20px rgba(168, 85, 247, 0.8); }
  }
</style>
</head>
  <body>
    <div id="loading-screen" class="loading-overlay">
      <div class="loading-logo">Ly-Os</div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        const screen = document.getElementById('loading-screen');
        if (screen) {
          setTimeout(() => {
            screen.style.opacity = '0';
            setTimeout(() => screen.remove(), 500);
          }, 1500);
        }
      });
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script type="text/babel" data-presets="react,typescript" data-type="module" src="./index.tsx"></script>
  </body>
</html>
